<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园食堂公共信息与数据展示中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">校园食堂中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="canteen-list.html">食堂查询</a></li>
          <li class="nav-item"><a class="nav-link" href="canteen-chart.html">数据统计</a></li>
          <li class="nav-item"><a class="nav-link" href="canteen-food.html">菜品浏览</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/canteen-scene.html">食堂三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 主图 Banner -->
  <header class="canteen-banner">
    <div class="banner-overlay">
      <div class="container text-center text-white">
        <h1 class="display-4 fw-bold">校园食堂公共信息与数据展示中心</h1>
        <p class="lead mt-3">窗口查询 · 就餐统计 · 菜品浏览 · 三维导览</p>
        <a href="canteen-list.html" class="btn btn-light btn-lg mt-4">进入食堂查询</a>
      </div>
    </div>
  </header>

  <!-- 功能入口 -->
  <main class="container my-5">
    <h2 class="text-center mb-4">功能模块</h2>
    <div class="row g-4">

      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body text-center">
            <div class="icon-box bg-success text-white mb-3">🍜</div>
            <h5 class="card-title">食堂窗口查询</h5>
            <p class="card-text">查询食堂楼层、窗口类型、开放状态。</p>
            <a href="canteen-list.html" class="btn btn-success">进入查询</a>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body text-center">
            <div class="icon-box bg-primary text-white mb-3">📊</div>
            <h5 class="card-title">就餐数据统计</h5>
            <p class="card-text">用柱状图查看各窗口就餐人数。</p>
            <a href="canteen-chart.html" class="btn btn-primary">查看统计</a>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body text-center">
            <div class="icon-box bg-warning text-white mb-3">🥗</div>
            <h5 class="card-title">热门菜品浏览</h5>
            <p class="card-text">浏览菜品名称、价格和推荐标签。</p>
            <a href="canteen-food.html" class="btn btn-warning">浏览菜品</a>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body text-center">
            <div class="icon-box bg-info text-white mb-3">🏢</div>
            <h5 class="card-title">食堂三维导览</h5>
            <p class="card-text">三维场景查看食堂楼层与窗口分布。</p>
            <a href="three-d/canteen-scene.html" class="btn btn-info text-white">进入三维</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="bg-light py-4 text-center">
    <p>校园食堂公共信息与数据展示中心 © 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
