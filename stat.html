<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自习室使用统计</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">校园信息中心</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
        <li class="nav-item"><a class="nav-link" href="study.html">自习室</a></li>
        <li class="nav-item"><a class="nav-link active" href="stat.html">统计</a></li>
        <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container mt-5">
  <h2 class="mb-4">自习室使用量统计图表</h2>
  <div id="status" class="alert alert-warning" style="display:none;"></div>
  <div id="chart" style="width:100%;height:450px;"></div>
  <p class="mt-3 text-secondary">数据来源：<span id="srcText"></span>；单位：<span id="unitText"></span></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const chartDom = document.getElementById('chart');
const statusDom = document.getElementById('status');
let myChart = echarts.init(chartDom);

// 复用指南6 async/await + try catch 处理四种状态
async function loadChartData(){
  statusDom.style.display = "block";
  statusDom.textContent = "加载中...";
  try {
    const res = await fetch("data.json");
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    statusDom.style.display = "none";

    document.getElementById("srcText").innerText = data.source;
    document.getElementById("unitText").innerText = data.unit;

    const opt = {
      title:{text:data.title, left:"center"},
      tooltip:{trigger:"axis"},
      xAxis:{type:"category", data:data.rooms, name:"自习室编号"},
      yAxis:{type:"value", name:data.unit},
      series:[{type:"bar", data:data.values}],
    };
    myChart.setOption(opt);
  }catch(err){
    statusDom.textContent = "加载失败："+err.message;
    statusDom.style.display = "block";
    console.error(err);
  }
}

//窗口resize适配（指南6要求）
window.addEventListener("resize",()=>{
  if(myChart) myChart.resize();
})

loadChartData();
</script>
</body>
</html>
