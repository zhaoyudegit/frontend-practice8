<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自习室查询</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">校园信息中心</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
        <li class="nav-item"><a class="nav-link active" href="study.html">自习室</a></li>
        <li class="nav-item"><a class="nav-link" href="stat.html">统计</a></li>
        <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container mt-5">
  <h2 class="mb-4">自习室查询</h2>
  <div class="row mb-4 g-3">
    <div class="col-auto">
      <label class="form-label">楼层筛选</label>
      <select id="floorSelect" class="form-select">
        <option value="all">全部楼层</option>
        <option value="1">1楼</option>
        <option value="2">2楼</option>
        <option value="3">3楼</option>
      </select>
    </div>
    <div class="col-auto">
      <label class="form-label">开放状态</label>
      <select id="statusSelect" class="form-select">
        <option value="all">全部状态</option>
        <option value="open">开放</option>
        <option value="close">关闭</option>
      </select>
    </div>
  </div>
  <div id="roomList" class="row g-3"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// 指南5模式：数组作为唯一状态源
const roomData = [
  {name:"自习室101", floor:"1", status:"open", seat:40},
  {name:"自习室102", floor:"1", status:"close", seat:35},
  {name:"自习室201", floor:"2", status:"open", seat:50},
  {name:"自习室202", floor:"2", status:"open", seat:42},
  {name:"自习室301", floor:"3", status:"close", seat:48},
  {name:"自习室302", floor:"3", status:"open", seat:38},
];

const floorSel = document.getElementById("floorSelect");
const statusSel = document.getElementById("statusSelect");
const listWrap = document.getElementById("roomList");

// 先过滤数组，再渲染DOM（指南五核心心智模型）
function renderList(){
  const floorVal = floorSel.value;
  const statusVal = statusSel.value;
  let filterData = roomData;
  if(floorVal !== "all") filterData = filterData.filter(item=>item.floor === floorVal);
  if(statusVal !== "all") filterData = filterData.filter(item=>item.status === statusVal);

  listWrap.innerHTML = "";
  if(filterData.length === 0){
    listWrap.innerHTML = `<p class="text-secondary">没有匹配的自习室</p>`;
    return;
  }
  filterData.forEach(room=>{
    const statusText = room.status === "open" ? "开放" : "关闭";
    const statusClass = room.status === "open" ? "text-success" : "text-danger";
    const cardHtml = `
      <div class="col-md-4">
        <div class="card p-3 h-100">
          <h5>${room.name}</h5>
          <p>楼层：${room.floor}楼</p>
          <p>座位数：${room.seat}</p>
          <p class="${statusClass}">状态：${statusText}</p>
        </div>
      </div>
    `;
    listWrap.innerHTML += cardHtml;
  })
}
// change事件触发重新渲染
floorSel.addEventListener("change", renderList);
statusSel.addEventListener("change", renderList);
renderList();
</script>
</body>
</html>
