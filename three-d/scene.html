<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园地标三维区</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/custom.css">
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    #canvas-container{width:100%;height:500px;}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="../index.html">校园信息中心</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="../index.html">首页</a></li>
        <li class="nav-item"><a class="nav-link" href="../study.html">自习室</a></li>
        <li class="nav-item"><a class="nav-link" href="../stat.html">统计</a></li>
        <li class="nav-item"><a class="nav-link active" href="scene.html">校园三维</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container mt-5">
  <h2 class="mb-4">校园三维导览场景</h2>
  <div id="canvas-container"></div>
  <p class="mt-3">操作提示：鼠标拖拽旋转视角，滚轮缩放场景</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// 完全遵循指南7的Three.js最小场景范式
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f8ff);

//透视相机
const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1,1000);
camera.position.set(6,4,6);

//渲染器开启抗锯齿
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

//轨道控制器 OrbitControls 指南7
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

//地面
const groundGeo = new THREE.PlaneGeometry(20,20);
const groundMat = new THREE.MeshLambertMaterial({color:0x90EE90});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

//教学楼几何体
const buildingGeo = new THREE.BoxGeometry(3,2.5,2);
const buildingMat = new THREE.MeshLambertMaterial({color:0x4488dd});
const building = new THREE.Mesh(buildingGeo, buildingMat);
building.position.y = 1.25;
scene.add(building);

//双光源：环境光+方向光（指南7标准）
scene.add(new THREE.AmbientLight(0xffffff,0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5,8,5);
scene.add(dirLight);

//动画循环 requestAnimationFrame
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

//窗口resize适配（指南7必做）
window.addEventListener("resize",()=>{
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
})
</script>
</body>
</html>
